spring.application.name=n-track
spring.config.import=optional:file:.env[.properties]

# Alles rechnet in dieser Zone; die Zeit selbst kommt aus der Clock-Bean.
ntrack.zone=Europe/Vienna

# Der Tag wechselt erst um diese Uhrzeit; davor gilt noch der Vortag.
ntrack.day-starts-at=04:00

# Das Schema gehoert Flyway, Hibernate darf es nur pruefen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Auch Springs eigene Fehler als problem+json (in Boot 4.1 per Default aus).
spring.mvc.problemdetails.enabled=true
