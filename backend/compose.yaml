# Der Projektname steht hier, weil Compose ihn sonst vom Ordner nimmt ("backend") und
# Spring beim Start eine zweite, leere Datenbank hochzieht.
name: n-track

services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=ntrack'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=ntrack'
    # Bewusst ohne festen Host-Port: Spring liest den gemappten Port selbst aus
    # "docker compose ps", und ein lokal laufendes Postgres kollidiert nicht.
    ports:
      - '5432'
